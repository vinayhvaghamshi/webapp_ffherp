name: Deploy site to GitHub Pages

# Builds the React app in frontend/ and publishes it to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps: the project pins react-day-picker v8 alongside date-fns v4
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # PUBLIC_URL puts the build under /webapp_ffherp/ for GitHub Pages;
      # CI=false so CRA's warning-as-error behaviour does not fail the deploy.
      - name: Build
        working-directory: frontend
        env:
          CI: "false"
          PUBLIC_URL: /webapp_ffherp
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
